<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPSE Voice Alert Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0e27; color: white; font-family: Arial; padding: 10px; }
.header { background: linear-gradient(135deg, #DC143C, #8B0000); padding: 12px; text-align: center; border-radius: 10px; }
.alert-on { background: #00ff88; color: #000; padding: 8px; border-radius: 20px; text-align: center; margin: 10px 0; }

/* BEST TIME BOX */
.best-time-box { background: #0f2a1a; border: 2px solid #00ff88; padding: 15px; border-radius: 15px; margin: 10px 0; text-align: center; animation: glow 2s infinite; }
@keyframes glow { 0%,100%{box-shadow:0 0 5px #00ff88} 50%{box-shadow:0 0 20px #00ff88} }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
.stat-card { background: #131a33; padding: 12px; border-radius: 12px; text-align: center; border: 2px solid #00d4ff; }
.stat-card.num { font-size: 22px; font-weight: bold; color: #00d4ff; }
.profit { color: #00ff88; }.loss { color: #ff4d4d; }

.price-board { background: #131a33; padding: 15px; border-radius: 15px; margin: 10px 0; border: 2px solid #00d4ff; }
.price-main { font-size: 38px; font-weight: bold; text-align: center; }

.buy-sell-box { display: flex; gap: 10px; margin: 10px 0; }
.box { flex: 1; padding: 15px; border-radius: 12px; text-align: center; }
.buy-box { background: #0f2a1a; border: 2px solid #00ff88; }
.sell-box { background: #3a1a1a; border: 2px solid #ff4d4d; }
.percent { font-size: 28px; font-weight: bold; }

.chart-box { background: #131a33; padding: 10px; border-radius: 15px; margin: 10px 0; }
select, button { width: 100%; padding: 15px; margin: 6px 0; font-size: 16px; background: #131a33; color: white; border: 2px solid #00d4ff; border-radius: 12px; }
.scan-btn { background: #00d4ff; color: #000; font-weight: bold; }
.signal { padding: 18px; margin: 10px 0; border-radius: 15px; border-left: 8px solid; animation: slideIn 0.3s; }
@keyframes slideIn { from{transform:translateX(-100%)} to{transform:translateX(0)} }
.sell { background: #3a1a1a; border-color: #ff4d4d; }
.buy { background: #0f2a1a; border-color: #00ff88; }
.up { color: #00ff88; }.down { color: #ff4d4d; }
</style>
</head>
<body>

<div class="header">
  <h1>🇳🇵 NEPSE Voice Alert Pro</h1>
  <p id="marketStatus">Market: CLOSED</p>
</div>

<div id="alertStatus" class="alert-on">🔊 Sound Alert: ON</div>

<!-- BEST TIME ALERT -->
<div class="best-time-box" id="bestTimeBox" style="display:none;">
  <h2>⚡ BEST TIME STARTED!</h2>
  <p id="bestTimeText">अहिले Trade गर्नु</p>
</div>

<!-- STATS -->
<div class="stats-grid">
  <div class="stat-card">
    <h4>Total</h4>
    <div id="totalSignal" class="num">0</div>
  </div>
  <div class="stat-card">
    <h4>Win Rate</h4>
    <div id="winRate" class="num">0%</div>
  </div>
  <div class="stat-card">
    <h4>Profit</h4>
    <div id="netProfit" class="num">Rs.0</div>
  </div>
</div>

<div class="price-board">
  <div id="stockName">NEPSE Index</div>
  <div id="livePrice" class="price-main">---.--</div>
  <div id="priceChange">--.-- (--%)</div>
</div>

<select id="stock" onchange="loadData()">
  <option value="NEPSE">NEPSE Index</option>
  <option value="NABIL">NABIL</option>
  <option value="SCB">SCB</option>
  <option value="NICL">NICL</option>
  <option value="GBIME">GBIME</option>
</select>

<div class="buy-sell-box">
  <div class="box buy-box">
    <div>🟢 BUY %</div>
    <div id="buyPercent" class="percent">--%</div>
  </div>
  <div class="box sell-box">
    <div>🔴 SELL %</div>
    <div id="sellPercent" class="percent">--%</div>
  </div>
</div>

<div class="chart-box">
  <h3>📊 Hour Wise Win Rate</h3>
  <canvas id="hourChart"></canvas>
</div>

<button class="scan-btn" onclick="scan()">🔍 SCAN</button>
<button onclick="testVoice()">🔊 Test Voice</button>
<div id="out"></div>

<script>
let history = JSON.parse(localStorage.getItem('nepseHistoryVoice')) || [];
let hourChart, currentPrice = 0;
let bestHour = 11; // Default
let lastAlert = "";

// VOICE FUNCTION
function speak(text){
  if('speechSynthesis' in window){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ne-NP'; // Nepali
    msg.rate = 1.1;
    msg.volume = 1;
    speechSynthesis.speak(msg);
  }
  navigator.vibrate([200,100,200]); // Phone Vibrate
}

function testVoice(){
  speak("NEPSE Voice Alert Active छ दाइ");
}

function playBeep(){
  let audio = new Audio("data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT");
  audio.play();
}

function analyzeBestTime(){
  let hourStats = {};
  history.forEach(h => {
    if(h.result!== 'PENDING'){
      let hour = parseInt(h.time.split(':')[0]);
      if(!hourStats[hour]) hourStats[hour] = {total:0, wins:0};
      hourStats[hour].total++;
      if(h.result === 'WIN') hourStats[hour].wins++;
    }
  });

  let best = {hour:11, rate:0};
  for(let h in hourStats){
    let rate = (hourStats[h].wins / hourStats[h].total * 100);
    if(rate > best.rate) best = {hour:parseInt(h), rate:rate};
  }
  bestHour = best.hour;

  // BEST TIME CHECK
  let nowHour = new Date().toLocaleString('en-US', {hour:'2-digit', hour12:false, timeZone:'Asia/Kathmandu'});
  if(parseInt(nowHour) === bestHour && lastAlert!== bestHour){
    document.getElementById('bestTimeBox').style.display = 'block';
    document.getElementById('bestTimeText').innerText = `${bestHour}:00 - ${bestHour}:59 बजे Win Rate ${best.rate.toFixed(0)}% छ`;
    speak(`${bestHour} बजे Best Time सुरु भयो। अहिले Trade गर्नु`);
    playBeep();
    lastAlert = bestHour;
  }
}

function updateStats(){
  let total = history.length;
  let wins = history.filter(h => h.result === 'WIN').length;
  let profit = history.reduce((sum, h) => sum + (h.pnl || 0), 0);
  let winRate = total > 0? (wins / total * 100).toFixed(1) : 0;
  document.getElementById('totalSignal').innerText = total;
  document.getElementById('winRate').innerText = winRate + '%';
  document.getElementById('netProfit').innerText = 'Rs.' + profit.toFixed(0);
}

async function loadData(){
  let stock = document.getElementById('stock').value;
  document.getElementById('stockName').innerText = stock;
  try {
    let url = stock === "NEPSE"? "https://www.sharehub.com.np/api/market/summary/" : "https://www.sharehub.com.np/api/company/" + stock + "/";
    let res = await fetch(url);
    let data = await res.json();
    currentPrice = data.ltp || data.price;
    let change = data.change || 0;
    let changePercent = data.changePercent || 0;
    document.getElementById('livePrice').innerText = currentPrice;
    document.getElementById('priceChange').innerText = `${change} (${changePercent}%)`;
    document.getElementById('priceChange').className = change >= 0? 'up' : 'down';

    let changeVal = parseFloat(changePercent);
    let buyPercent = 50 + (changeVal * 5);
    buyPercent = Math.max(10, Math.min(90, buyPercent));
    document.getElementById('buyPercent').innerText = buyPercent.toFixed(1) + '%';
    document.getElementById('sellPercent').innerText = (100-buyPercent).toFixed(1) + '%';
  } catch(e){}
}

function saveSignal(stock, type, buyP, sellP, price, tp, sl){
  let time = new Date().toLocaleTimeString('en-US', {hour12:false, timeZone:'Asia/Kathmandu'});
  let item = {stock, type, buyP, sellP, entryPrice: price, tp, sl, time, result: 'PENDING', pnl: 0};
  history.unshift(item);
  localStorage.setItem('nepseHistoryVoice', JSON.stringify(history));
  updateStats();
}

function checkResults(){
  history.forEach(h => {
    if(h.result === 'PENDING'){
      if(h.type === 'BUY'){
        if(currentPrice >= h.tp) { h.result = 'WIN'; h.pnl = (h.tp - h.entryPrice) * 10; }
        else if(currentPrice <= h.sl) { h.result = 'LOSS'; h.pnl = (h.sl - h.entryPrice) * 10; }
      }
      if(h.type === 'SELL'){
        if(currentPrice <= h.tp) { h.result = 'WIN'; h.pnl = (h.entryPrice - h.tp) * 10; }
        else if(currentPrice >= h.sl) { h.result = 'LOSS'; h.pnl = (h.entryPrice - h.sl) * 10; }
      }
    }
  });
  localStorage.setItem('nepseHistoryVoice', JSON.stringify(history));
}

function scan(){
  let buyP = parseFloat(document.getElementById('buyPercent').innerText);
  let sellP = parseFloat(document.getElementById('sellPercent').innerText);
  let price = currentPrice;
  let stock = document.getElementById('stock').value;
  let out = "";
  let type = "WAIT";
  let tp, sl;

  if(buyP > 65){
    type = "BUY"; tp = (price + 20).toFixed(2); sl = (price - 20).toFixed(2);
    out = `<div class="signal buy"><h2>📈 BUY SIGNAL - ${stock}</h2>Entry: ${price} TP: ${tp} SL: ${sl}</div>`;
    saveSignal(stock, type, buyP, sellP, price, tp, sl);
    speak(`${stock} मा Buy Signal आयो। Entry ${price}`);
    playBeep();
  }
  else if(sellP > 65){
    type = "SELL"; tp = (price - 20).toFixed(2); sl = (price + 20).toFixed(2);
    out = `<div class="signal sell"><h2>📉 SELL SIGNAL - ${stock}</h2>Entry: ${price} TP: ${tp} SL: ${sl}</div>`;
    saveSignal(stock, type, buyP, sellP, price, tp, sl);
    speak(`${stock} मा Sell Signal आयो। Entry ${price}`);
    playBeep();
  }
  else{
    out = `<div class="signal" style="background:#2a2600"><h2>⚖️ NO SIGNAL</h2>Wait</div>`;
  }
  document.getElementById('out').innerHTML = out;
}

function checkMarket(){
  let hour = new Date().toLocaleString('en-US', {hour:'2-digit', hour12:false, timeZone:'Asia/Kathmandu'});
  document.getElementById('marketStatus').innerText = (hour >= 11 && hour < 15)? 'Market: OPEN ● LIVE' : 'Market: CLOSED';
}
setInterval(checkMarket, 60000); checkMarket();
window.onload = () => { loadData(); updateStats(); analyzeBestTime(); }
setInterval(() => { loadData(); checkResults(); analyzeBestTime(); }, 30000);
</script>
</body>
</html>
