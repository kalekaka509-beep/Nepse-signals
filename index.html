<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPSE Voice Alert Pro - API</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0e27; color: white; font-family: Arial; padding: 10px; }
.header { background: linear-gradient(135deg, #DC143C, #8B0000); padding: 15px; text-align: center; border-radius: 12px; }
.sound-on { background: #00ff88; color:#000; padding: 12px; text-align:center; border-radius:10px; margin:10px 0; font-weight:bold; }
.price-board { background: #131a33; padding: 25px; border-radius: 15px; margin: 10px 0; border: 3px solid #00d4ff; text-align:center; }
.price-main { font-size: 48px; font-weight: bold; color:#00d4ff; }
select, button { width: 100%; padding: 16px; margin: 8px 0; font-size: 17px; background: #131a33; color: white; border: 2px solid #00d4ff; border-radius: 12px; }
.buy-sell-box { display: flex; gap: 10px; }
.box { flex: 1; padding: 20px; border-radius: 12px; text-align: center; font-size:20px; font-weight:bold; }
.buy-box { background: #0f2a1a; border: 3px solid #00ff88; }
.sell-box { background: #3a1a1a; border: 3px solid #ff4d4d; }
.scan-btn { background: #00d4ff; color: #000; font-weight: bold; }
.up { color: #00ff88; }.down { color: #ff4d4d; }
</style>
</head>
<body>

<div class="header">
  <h1>🇳🇵 NEPSE Live Price</h1>
  <p id="marketStatus">Market: Checking...</p>
</div>

<div class="sound-on">🔊 Voice Alert: ON</div>

<div class="price-board">
  <div id="stockName">NEPSE</div>
  <div id="livePrice" class="price-main">Loading...</div>
  <div id="priceChange">--</div>
</div>

<select id="stock" onchange="loadData()">
  <option value="NEPSE">NEPSE Index</option>
  <option value="NABIL">NABIL</option>
  <option value="SCB">SCB</option>
  <option value="NICL">NICL</option>
  <option value="GBIME">GBIME</option>
  <option value="HBL">HBL</option>
</select>

<div class="buy-sell-box">
  <div class="box buy-box">🟢 BUY<br><span id="buyPercent">--%</span></div>
  <div class="box sell-box">🔴 SELL<br><span id="sellPercent">--%</span></div>
</div>

<button class="scan-btn" onclick="scan()">🔍 SCAN SIGNAL</button>

<script>
let currentPrice = 0;
let prevPrice = 0;

// 100% WORKING API - NO CORS
const API_BASE = "https://nepse-data-api.vercel.app/api";

async function loadData(){
  let stock = document.getElementById('stock').value;
  document.getElementById('stockName').innerText = stock;
  document.getElementById('livePrice').innerText = "Loading...";

  try {
    let res, data;
    
    if(stock === "NEPSE"){
      // NEPSE Index
      res = await fetch(`${API_BASE}/market`);
      data = await res.json();
      currentPrice = data.index;
      document.getElementById('livePrice').innerText = currentPrice.toFixed(2);
      document.getElementById('priceChange').innerText = `Points: ${data.change} (${data.changePercent}%)`;
      document.getElementById('priceChange').className = data.change >= 0? 'up' : 'down';
    } else {
      // Individual Stock
      res = await fetch(`${API_BASE}/company/${stock}`);
      data = await res.json();
      currentPrice = data.ltp;
      document.getElementById('livePrice').innerText = currentPrice.toFixed(2);
      document.getElementById('priceChange').innerText = `Rs.${data.change} (${data.changePercent}%)`;
      document.getElementById('priceChange').className = data.change >= 0? 'up' : 'down';
    }

    // BUY SELL %
    let buyPercent = 50 + (parseFloat(data.changePercent) * 10);
    buyPercent = Math.max(15, Math.min(85, buyPercent));
    document.getElementById('buyPercent').innerText = buyPercent.toFixed(1) + '%';
    document.getElementById('sellPercent').innerText = (100-buyPercent).toFixed(1) + '%';

    // PRICE ALERT Rs.5
    if(prevPrice > 0 && Math.abs(currentPrice - prevPrice) >= 5){
      speak(`${stock} Rs.${Math.abs(currentPrice - prevPrice).toFixed(2)} ले Move भयो`);
    }
    prevPrice = currentPrice;

    checkMarket();

  } catch(e){
    console.log(e);
    document.getElementById('livePrice').innerText = "Error";
  }
}

function speak(text){
  if('speechSynthesis' in window){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ne-NP';
    speechSynthesis.speak(msg);
  }
}

function scan(){
  let buyP = parseFloat(document.getElementById('buyPercent').innerText);
  let stock = document.getElementById('stock').value;
  if(buyP > 65){
    speak(`${stock} मा Buy Signal छ`);
    alert(`📈 BUY SIGNAL\n${stock} @ Rs.${currentPrice}`);
  } else {
    alert(`⚖️ NO SIGNAL. Wait गर्नु`);
  }
}

function checkMarket(){
  let hour = new Date().toLocaleString('en-US', {hour:'2-digit', hour12:false, timeZone:'Asia/Kathmandu'});
  document.getElementById('marketStatus').innerText = (hour >= 11 && hour < 15)? 'Market: OPEN ● LIVE' : 'Market: CLOSED';
}

window.onload = loadData;
setInterval(loadData, 15000); // 15s मा update
setInterval(checkMarket, 60000);
</script>
</body>
</html>
