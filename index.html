<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPSE Voice Alert Pro - 3 Proxy</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0e27; color: white; font-family: Arial; padding: 10px; }
.header { background: linear-gradient(135deg, #DC143C, #8B0000); padding: 15px; text-align: center; border-radius: 12px; }
.sound-on { background: #00ff88; color:#000; padding: 12px; text-align:center; border-radius:10px; margin:10px 0; font-weight:bold; }
.stats { display: flex; gap: 8px; margin: 10px 0; }
.stat-box { flex:1; background:#131a33; padding:12px; border-radius:10px; text-align:center; border:2px solid #00d4ff; }
.price-board { background: #131a33; padding: 20px; border-radius: 15px; margin: 10px 0; border: 3px solid #00d4ff; text-align:center; }
.price-main { font-size: 42px; font-weight: bold; color:#00d4ff; }
select, button { width: 100%; padding: 15px; margin: 8px 0; font-size: 16px; background: #131a33; color: white; border: 2px solid #00d4ff; border-radius: 12px; }
.buy-sell-box { display: flex; gap: 10px; }
.box { flex: 1; padding: 18px; border-radius: 12px; text-align: center; font-size:18px; }
.buy-box { background: #0f2a1a; border: 2px solid #00ff88; }
.sell-box { background: #3a1a1a; border: 2px solid #ff4d4d; }
.scan-btn { background: #00d4ff; color: #000; font-weight: bold; }
.up { color: #00ff88; }.down { color: #ff4d4d; }
.loading { color: #00d4ff; animation: blink 1s infinite; }
@keyframes blink { 50%{opacity:0.3} }
</style>
</head>
<body>

<div class="header">
  <h1>🇳🇵 NEPSE Voice Alert Pro</h1>
  <p id="marketStatus">Market: Checking...</p>
</div>

<div class="sound-on">🔊 Sound Alert: ON</div>

<div class="stats">
  <div class="stat-box">Total<br><b id="total">0</b></div>
  <div class="stat-box">Win Rate<br><b id="winrate">0%</b></div>
  <div class="stat-box">Profit<br><b id="profit">Rs.0</b></div>
</div>

<div class="price-board">
  <div id="stockName">NEPSE</div>
  <div id="livePrice" class="price-main loading">Loading...</div>
  <div id="priceChange">--.-- (-%)</div>
</div>

<select id="stock" onchange="loadData()">
  <option value="NEPSE">NEPSE Index</option>
  <option value="NABIL">NABIL</option>
  <option value="SCB">SCB</option>
  <option value="NICL">NICL</option>
  <option value="GBIME">GBIME</option>
</select>

<div class="buy-sell-box">
  <div class="box buy-box">🟢 BUY %<br><b id="buyPercent">--%</b></div>
  <div class="box sell-box">🔴 SELL %<br><b id="sellPercent">--%</b></div>
</div>

<button class="scan-btn" onclick="scan()">🔍 SCAN SIGNAL</button>

<script>
let currentPrice = 0;

// 3 OTA PROXY - 1 FAIL BHAYE ARKO CHALCHA
const PROXIES = [
  "https://api.allorigins.win/raw?url=",
  "https://corsproxy.io/?",
  "https://proxy.cors.sh/"
];

async function fetchWithProxy(url){
  for(let proxy of PROXIES){
    try{
      let res = await fetch(proxy + encodeURIComponent(url));
      if(res.ok){
        let text = await res.text();
        return text;
      }
    }catch(e){}
  }
  throw new Error("All proxies failed");
}

async function loadData(){
  let stock = document.getElementById('stock').value;
  document.getElementById('stockName').innerText = stock;
  document.getElementById('livePrice').innerText = "Loading...";
  document.getElementById('livePrice').className = "price-main loading";

  try {
    // NEPSE website scrape
    let html = await fetchWithProxy("https://www.nepalstock.com.np");
    let parser = new DOMParser();
    let doc = parser.parseFromString(html, 'text/html');

    if(stock === "NEPSE"){
      let indexEl = doc.querySelector('.index-value,.nepal-index.value');
      let changeEl = doc.querySelector('.index-change,.nepal-index.change');
      if(indexEl){
        currentPrice = parseFloat(indexEl.innerText.replace(/,/g,''));
        document.getElementById('livePrice').innerText = currentPrice.toFixed(2);
        document.getElementById('priceChange').innerText = changeEl? changeEl.innerText : "--";
      }
    } else {
      let rows = doc.querySelectorAll('table tbody tr');
      let found = false;
      rows.forEach(row => {
        let cells = row.querySelectorAll('td');
        if(cells[1] && cells[1].innerText.trim().includes(stock)){
          currentPrice = parseFloat(cells[4].innerText.replace(/,/g,'')); // LTP
          let change = parseFloat(cells[5].innerText.replace(/,/g,''));
          let changePercent = parseFloat(cells[6].innerText.replace('%',''));
          document.getElementById('livePrice').innerText = currentPrice.toFixed(2);
          document.getElementById('priceChange').innerText = `Rs.${change.toFixed(2)} (${changePercent.toFixed(2)}%)`;
          document.getElementById('priceChange').className = change >= 0? 'up' : 'down';
          found = true;
        }
      });
      if(!found) throw new Error("Stock not found");
    }

    document.getElementById('livePrice').className = "price-main";

    // BUY SELL %
    let changeText = document.getElementById('priceChange').innerText;
    let match = changeText.match(/\((.*)%\)/);
    let changePercent = match? parseFloat(match[1]) : 0;
    let buyPercent = 50 + (changePercent * 10);
    buyPercent = Math.max(15, Math.min(85, buyPercent));
    document.getElementById('buyPercent').innerText = buyPercent.toFixed(1) + '%';
    document.getElementById('sellPercent').innerText = (100-buyPercent).toFixed(1) + '%';

    checkMarket();

  } catch(e){
    console.log(e);
    document.getElementById('livePrice').innerText = "Error";
    document.getElementById('livePrice').className = "price-main down";
  }
}

function speak(text){
  if('speechSynthesis' in window){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ne-NP';
    speechSynthesis.speak(msg);
  }
}

function scan(){
  let buyP = parseFloat(document.getElementById('buyPercent').innerText);
  let stock = document.getElementById('stock').value;
  if(buyP > 65){
    speak(`${stock} मा Buy Signal`);
    alert(`📈 BUY SIGNAL @ Rs.${currentPrice}`);
  } else {
    alert(`⚖️ NO SIGNAL`);
  }
}

function checkMarket(){
  let hour = new Date().toLocaleString('en-US', {hour:'2-digit', hour12:false, timeZone:'Asia/Kathmandu'});
  document.getElementById('marketStatus').innerText = (hour >= 11 && hour < 15)? 'Market: OPEN ● LIVE' : 'Market: CLOSED';
}

window.onload = loadData;
setInterval(loadData, 20000);
setInterval(checkMarket, 60000);
</script>
</body>
</html>
