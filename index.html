<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPSE AI Terminal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0e27; color: white; font-family: Arial; padding: 10px; }
.header { background: linear-gradient(135deg, #DC143C, #8B0000); padding: 12px; text-align: center; border-radius: 10px; }
.card { background: #131a33; padding: 15px; border-radius: 15px; margin: 10px 0; border: 2px solid #00d4ff; }
.price-main { font-size: 42px; font-weight: bold; text-align: center; color:#00d4ff; }
.chart-box { height: 300px; }
.buy-sell-box { display: flex; gap: 10px; }
.box { flex: 1; padding: 15px; border-radius: 12px; text-align: center; }
.buy-box { background: #0f2a1a; border: 2px solid #00ff88; }
.sell-box { background: #3a1a1a; border: 2px solid #ff4d4d; }
.news-box { max-height: 250px; overflow-y: auto; }
.news-item { background: #0f1a2a; padding: 10px; margin: 8px 0; border-radius: 10px; border-left: 4px solid #FFD700; }
.news-item.imp { border-left: 4px solid #ff4d4d; animation: blink 1s infinite; }
@keyframes blink { 50%{opacity:0.5} }
.portfolio-item { display: flex; justify-content: space-between; padding: 10px; background:#0f1a2a; margin:5px 0; border-radius:8px; }

/* ALERT POPUP */
.alert-popup { position: fixed; top: 20px; right: 20px; background: #ff4d4d; padding: 15px; border-radius: 10px; z-index: 9999; display: none; animation: slideIn 0.3s; }
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }

input, select, button { width: 100%; padding: 12px; margin: 5px 0; font-size: 15px; background: #0a0e27; color: white; border: 2px solid #00d4ff; border-radius: 10px; }
.scan-btn { background: #00d4ff; color: #000; font-weight: bold; }
.profit { color: #00ff88; }.loss { color: #ff4d4d; }
</style>
</head>
<body>

<!-- ALERT POPUP -->
<div id="alertPopup" class="alert-popup"></div>

<div class="header">
  <h1>🇳🇵 NEPSE AI Terminal</h1>
  <p id="marketStatus">Loading...</p>
</div>

<!-- LIVE PRICE -->
<div class="card">
  <div id="stockName">NEPSE Index</div>
  <div id="livePrice" class="price-main">Loading...</div>
  <div id="priceChange">--</div>
</div>

<select id="stock" onchange="loadData()">
  <option value="NEPSE">NEPSE Index</option>
  <option value="NABIL">NABIL Bank</option>
  <option value="SCB">Standard Chartered</option>
  <option value="NICL">NIC Asia</option>
  <option value="GBIME">Global IME</option>
</select>

<!-- CANDLE CHART -->
<div class="card chart-box">
  <h3>📊 30 Days Candle Chart</h3>
  <canvas id="candleChart"></canvas>
</div>

<!-- BUY SELL % -->
<div class="buy-sell-box">
  <div class="box buy-box">
    <div>🟢 BUYERS %</div>
    <div id="buyPercent" style="font-size:24px; font-weight:bold;">--%</div>
  </div>
  <div class="box sell-box">
    <div>🔴 SELLERS %</div>
    <div id="sellPercent" style="font-size:24px; font-weight:bold;">--%</div>
  </div>
</div>

<!-- NEWS ALERT -->
<div class="card news-box">
  <h3>📰 Latest NEPSE News</h3>
  <div id="newsList">Loading News...</div>
</div>

<!-- PORTFOLIO TRACKER -->
<div class="card">
  <h3>💼 My Portfolio P&L</h3>
  <input type="text" id="pSymbol" placeholder="Symbol: NABIL">
  <input type="number" id="pQty" placeholder="Quantity: 100">
  <input type="number" id="pBuy" placeholder="Buy Price: 850">
  <button onclick="addHolding()">Add Holding</button>
  <div id="portfolioList"></div>
  <h3>Total P&L: <span id="totalPL">Rs.0</span></h3>
</div>

<button class="scan-btn" onclick="scan()">🔍 SCAN SIGNAL</button>
<div id="out"></div>

<script>
let currentPrice = 0;
let prevPrice = 0;
let candleChart;
let lastNews = [];
let portfolio = JSON.parse(localStorage.getItem('nepsePortfolio')) || [];

// APP ALERT POPUP
function showAlert(message, color='#ff4d4d'){
  let popup = document.getElementById('alertPopup');
  popup.style.background = color;
  popup.innerText = message;
  popup.style.display = 'block';
  setTimeout(() => { popup.style.display = 'none'; }, 5000);
  
  // Sound + Vibrate
  let audio = new Audio("data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT");
  audio.play();
  navigator.vibrate([200,100,200]);
}

// PORTFOLIO
function addHolding(){
  let s = document.getElementById('pSymbol').value.toUpperCase();
  let q = parseFloat(document.getElementById('pQty').value);
  let b = parseFloat(document.getElementById('pBuy').value);
  portfolio.push({symbol:s, qty:q, buy:b});
  localStorage.setItem('nepsePortfolio', JSON.stringify(portfolio));
  showPortfolio();
  showAlert(`${s} Portfolio मा Add भयो`, '#00ff88');
}
function showPortfolio(){
  let html = ""; let total = 0;
  portfolio.forEach((p,i) => {
    let ltp = currentPrice;
    let pl = (ltp - p.buy) * p.qty;
    total += pl;
    html += `<div class="portfolio-item">
      <div>${p.symbol} ${p.qty}Qty @${p.buy}</div>
      <div class="${pl>=0?'profit':'loss'}">Rs.${pl.toFixed(0)}</div>
    </div>`;
  });
  document.getElementById('portfolioList').innerHTML = html;
  document.getElementById('totalPL').innerText = "Rs." + total.toFixed(0);
  document.getElementById('totalPL').className = total>=0?'profit':'loss';
}

// NEWS
async function loadNews(){
  try {
    let res = await fetch("https://www.nepsedata.com.np/api/v1/news");
    let news = await res.json();
    let html = ""; 
    news.slice(0,10).forEach(n => {
      let isImp = n.title.toLowerCase().includes("dividend") || n.title.toLowerCase().includes("bonus") || n.title.toLowerCase().includes("agm");
      html += `<div class="news-item ${isImp?'imp':''}"><b>${n.company}</b> - ${n.title}</div>`;
      
      // Naya Important News आयो भने App Alert
      if(isImp && !lastNews.includes(n.id)){
        showAlert(`🚨 ${n.company}: ${n.title}`, '#FFD700');
      }
    });
    document.getElementById('newsList').innerHTML = html;
    lastNews = news.slice(0,10).map(n => n.id);
  } catch(e){}
}

// CANDLE CHART
async function loadCandleData(stock){
  try {
    let res = await fetch(`https://www.nepsedata.com.np/api/v1/company/${stock}/history?range=1M`);
    let data = await res.json();
    const ctx = document.getElementById('candleChart').getContext('2d');
    if(candleChart) candleChart.destroy();
    let candles = data.map(d => ({x: new Date(d.date), o: d.open, h: d.high, l: d.low, c: d.close}));
    candleChart = new Chart(ctx, {type: 'candlestick', data: {datasets: [{data: candles}]}});
  } catch(e){}
}

// LIVE PRICE + PRICE ALERT
async function loadData(){
  let stock = document.getElementById('stock').value;
  document.getElementById('stockName').innerText = stock;
  try {
    let url = stock === "NEPSE"? "https://www.nepsedata.com.np/api/v1/market-summary" : `https://www.nepsedata.com.np/api/v1/company/${stock}`;
    let res = await fetch(url);
    let data = await res.json();
    
    prevPrice = currentPrice;
    currentPrice = stock === "NEPSE"? data.index : data.ltp;
    
    document.getElementById('livePrice').innerText = currentPrice.toFixed(2);
    let change = data.change; let changePercent = data.changePercent;
    document.getElementById('priceChange').innerText = `Rs.${change.toFixed(2)} (${changePercent.toFixed(2)}%)`;
    document.getElementById('priceChange').className = (change >= 0)? 'profit' : 'loss';

    // PRICE ALERT Rs.5
    let priceDiff = Math.abs(currentPrice - prevPrice);
    if(prevPrice > 0 && priceDiff >= 5){
      showAlert(`🚨 ${stock} Rs.${priceDiff.toFixed(2)} ले Move भयो!\nअहिले: ${currentPrice.toFixed(2)}`);
    }

    // BUY SELL %
    let buyPercent = 50 + (changePercent * 10);
    buyPercent = Math.max(15, Math.min(85, buyPercent));
    document.getElementById('buyPercent').innerText = buyPercent.toFixed(1) + '%';
    document.getElementById('sellPercent').innerText = (100-buyPercent).toFixed(1) + '%';

    loadCandleData(stock);
    showPortfolio();

  } catch(e){}
}

function scan(){
  let buyP = parseFloat(document.getElementById('buyPercent').innerText);
  if(buyP > 65){
    showAlert(`📈 BUY SIGNAL: ${document.getElementById('stock').value}`, '#00ff88');
  } else {
    showAlert(`⚖️ NO SIGNAL. Wait गर्नु`, '#FFD700');
  }
}

function checkMarket(){
  let hour = new Date().toLocaleString('en-US', {hour:'2-digit', hour12:false, timeZone:'Asia/Kathmandu'});
  document.getElementById('marketStatus').innerText = (hour >= 11 && hour < 15)? 'Market: OPEN ● LIVE' : 'Market: CLOSED';
}

setInterval(checkMarket, 60000); 
checkMarket();
window.onload = () => { loadData(); loadNews(); showPortfolio(); }
setInterval(loadData, 15000);
setInterval(loadNews, 60000);
</script>
</body>
</html>
